[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ramworld-image-tool"
version = "0.1.0"
description = "Internal tool for optimizing and SEO-renaming company images."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "Pillow>=10",
    "python-slugify>=8",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
