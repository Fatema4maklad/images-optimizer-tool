[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ramworld-image-tool"
version = "0.1.0"
description = "Internal tool for optimizing and SEO-renaming company images."
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10",
    "python-slugify>=8",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "python-multipart>=0.0.9", "uvicorn>=0.30"]
dev = ["httpx>=0.27", "pytest>=8", "fastapi>=0.115", "python-multipart>=0.0.9", "uvicorn>=0.30"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
